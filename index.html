  <style>
    :root {
      --bg: #0f0f13;
      --surface: #1a1a22;
      --surface2: #24242f;
      --border: #2e2e3a;
      --text: #e8e8ed;
      --text-muted: #9898a6;
      --accent: #7c6af5;
      --accent-hover: #6a58e0;
      --success: #22c55e;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      height: 100dvh;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      overscroll-behavior: none;
    }

    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      padding-top: max(12px, env(safe-area-inset-top));
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 600;
      font-size: 1.1rem;
    }

    .logo-icon {
      width: 34px;
      height: 34px;
      background: linear-gradient(135deg, #7c6af5, #a78bfa);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.15rem;
    }

    .install-btn {
      background: var(--accent);
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      display: none;
    }
    .install-btn.show {
      display: block;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .modes {
      display: flex;
      gap: 8px;
      padding: 12px 16px;
      overflow-x: auto;
      flex-shrink: 0;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }

    .mode-btn {
      flex-shrink: 0;
      padding: 8px 14px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 20px;
      color: var(--text-muted);
      font-size: 0.82rem;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s;
    }
    .mode-btn.active {
      background: rgba(124,106,245,0.2);
      border-color: var(--accent);
      color: #c4b5fd;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      -webkit-overflow-scrolling: touch;
    }

    .message {
      max-width: 100%;
      line-height: 1.55;
      font-size: 0.95rem;
    }

    .message.user {
      align-self: flex-end;
      background: var(--accent);
      color: white;
      padding: 11px 16px;
      border-radius: 18px 18px 4px 18px;
      max-width: 85%;
    }

    .message.assistant {
      align-self: flex-start;
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 14px 16px;
      border-radius: 4px 18px 18px 18px;
      width: 100%;
    }

    .message.system {
      align-self: center;
      background: var(--surface2);
      color: var(--text-muted);
      padding: 12px 16px;
      border-radius: 14px;
      font-size: 0.88rem;
      text-align: center;
      max-width: 95%;
      line-height: 1.5;
    }

    .prompt-box {
      background: #1e1e2a;
      border: 1px dashed #4c4c6a;
      border-radius: 12px;
      padding: 14px;
      font-family: ui-monospace, 'Cascadia Code', 'Consolas', monospace;
      font-size: 0.84rem;
      white-space: pre-wrap;
      color: #c4b5fd;
      margin-top: 6px;
      cursor: pointer;
      line-height: 1.45;
      word-break: break-word;
    }
    .prompt-box:active {
      border-color: var(--success);
    }

    .copy-status {
      margin-top: 10px;
      font-size: 0.8rem;
      color: var(--success);
      display: none;
    }

    .input-area {
      padding: 12px 16px;
      padding-bottom: max(12px, env(safe-area-inset-bottom));
      background: var(--surface);
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }

    .input-wrapper {
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }

    textarea {
      flex: 1;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 13px 16px;
      color: var(--text);
      font-size: 0.95rem;
      font-family: inherit;
      resize: none;
      min-height: 48px;
      max-height: 140px;
      outline: none;
      line-height: 1.4;
    }
    textarea:focus {
      border-color: var(--accent);
    }
    textarea::placeholder {
      color: var(--text-muted);
    }

    .send-btn {
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 14px;
      width: 48px;
      height: 48px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
      flex-shrink: 0;
    }
    .send-btn:active {
      background: var(--accent-hover);
    }

    .hint {
      text-align: center;
      font-size: 0.72rem;
      color: var(--text-muted);
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">
      <div class="logo-icon">🧠</div>
      <span>Multi-Model AI</span>
    </div>
    <button class="install-btn" id="installBtn">Install App</button>
  </header>

  <main>
    <div class="modes">
      <button class="mode-btn active" data-mode="default">⚡ High Quality</button>
      <button class="mode-btn" data-mode="show">🔍 Show All</button>
      <button class="mode-btn" data-mode="deep">🎯 Max Depth</button>
    </div>

    <div class="messages" id="messages">
      <div class="message system">
        <strong>Multi-Model AI App</strong><br><br>
        1. Question likho<br>
        2. Prompt generate hoga<br>
        3. Prompt pe click/tap karke copy karo<br>
        4. Grok chat mein paste karo<br><br>
        <span style="opacity:0.85">Is page ko Home Screen pe add karke normal app ki tarah use kar sakte ho.</span>
      </div>
    </div>

    <div class="input-area">
      <div class="input-wrapper">
        <textarea 
          id="userInput" 
          placeholder="Apna question yahan likho..."
          rows="1"
        ></textarea>
        <button class="send-btn" id="sendBtn">↑</button>
      </div>
      <div class="hint">Enter dabao → Prompt banega → Copy karke Grok mein paste karo</div>
    </div>
  </main>

  <script>
    let currentMode = 'default';
    document.querySelectorAll('.mode-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentMode = btn.dataset.mode;
      });
    });

    const input = document.getElementById('userInput');
    const messages = document.getElementById('messages');
    const sendBtn = document.getElementById('sendBtn');

    function generatePrompt() {
      const question = input.value.trim();
      if (!question) return;

      const userMsg = document.createElement('div');
      userMsg.className = 'message user';
      userMsg.textContent = question;
      messages.appendChild(userMsg);

      let prefix = '';
      if (currentMode === 'default') {
        prefix = 'Use multi-model reasoning for maximum accuracy and quality.\n\nQuestion: ';
      } else if (currentMode === 'show') {
        prefix = 'Use multi-model reasoning and show the different perspectives (Claude, ChatGPT, Gemini, DeepSeek, Grok) before giving the final synthesized answer.\n\nQuestion: ';
      } else {
        prefix = 'Use multi-model reasoning with maximum depth and rigor. Cross-check thoroughly and prioritize accuracy above everything.\n\nQuestion: ';
      }

      const fullPrompt = prefix + question;

      const asstMsg = document.createElement('div');
      asstMsg.className = 'message assistant';
      asstMsg.innerHTML = `
        <div style="font-size:0.82rem; color:var(--text-muted); margin-bottom:6px;">
          Ready Prompt — <strong>tap to copy</strong>
        </div>
        <div class="prompt-box">${escapeHtml(fullPrompt)}</div>
        <div class="copy-status">✓ Copied! Ab Grok chat mein paste karo</div>
      `;
      messages.appendChild(asstMsg);

      const promptBox = asstMsg.querySelector('.prompt-box');
      const status = asstMsg.querySelector('.copy-status');
      promptBox.addEventListener('click', () => {
        navigator.clipboard.writeText(fullPrompt).then(() => {
          status.style.display = 'block';
          promptBox.style.borderColor = 'var(--success)';
          setTimeout(() => {
            status.style.display = 'none';
            promptBox.style.borderColor = '';
          }, 2000);
        });
      });

      input.value = '';
      input.style.height = 'auto';
      messages.scrollTop = messages.scrollHeight;
    }

    sendBtn.addEventListener('click', generatePrompt);
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        generatePrompt();
      }
    });

    input.addEventListener('input', function() {
      this.style.height = 'auto';
      this.style.height = Math.min(this.scrollHeight, 140) + 'px';
    });

    function escapeHtml(text) {
      return text
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    // PWA Install
    let deferredPrompt;
    const installBtn = document.getElementById('installBtn');

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installBtn.classList.add('show');
    });

    installBtn.addEventListener('click', async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      const { outcome } = await deferredPrompt.userChoice;
      if (outcome === 'accepted') {
        installBtn.classList.remove('show');
      }
      deferredPrompt = null;
    });

    // iOS tip
    const isIos = /iphone|ipad|ipod/.test(window.navigator.userAgent.toLowerCase());
    const isInStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;

    if (isIos && !isInStandalone) {
      const tip = document.createElement('div');
      tip.className = 'message system';
      tip.innerHTML = `📱 <strong>iPhone / iPad pe install:</strong><br>
        Safari → Share button (□↑) → <strong>Add to Home Screen</strong>`;
      messages.appendChild(tip);
    }
  </script>
</body>
</html>
